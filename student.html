<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Display Student Names</title>
</head>
<body>

    <h1>Student Roster</h1>

    <script>
        const students = ["Rahul", "Anjali", "Amit", "Priya", "Vikram"];

        for (let i = 0; i < students.length; i++) {
            document.write(students[i] + "<br>");
        }
    </script>

</body>
</html>
