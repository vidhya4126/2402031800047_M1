<html>
<head>
    <title>variable and variable declaration</title>
</head>

<body>
    <h2>JavaScript Variables</h2>
    <p>In this example x, y, and z are variables.</p>
    <p id="demo"></p>
    <p id="sub"></p>
    <p id="div"></p>

<script>
    var x = 5;
    var y = 6;
    var z = x + y;
    document.getElementById("demo").innerHTML ="value of z is : " + z;

    var a = 5;
    var b = 6;
    var c = b - a;
    document.getElementById("sub").innerHTML ="value of c is : " + c;

    var p = 5;
    var q = 6;
    var r = b / a;
    document.getElementById("div").innerHTML ="value of r is : " + r;

</script>

</body>
</html>
