<!DOCTYPE html>
<html>
<body>
  <h3>Student Report</h3>

  <script>
    let marks = [85, 90, 78, 92, 88]; 
    let total = 0;

    for (let i = 0; i < marks.length; i++) {
      total += marks[i];
    }

    document.write("Individual Marks: " + marks + "<br>");
    document.write("<strong>Total Marks: " + total + "</strong>");
  </script>
</body>
</html>
