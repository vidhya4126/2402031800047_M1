<!DOCTYPE html>
<html lang="en">
<head>
    <title>JavaScript String Methods</title>
</head>
<body>

<h2>JavaScript String Methods Example</h2>

<script>

    var str = "Welcome to JavaScript Programming";

    // charAt()
    document.write("<b>charAt():</b> " + str.charAt(5) + "<br><br>");

    // concat()
    var str2 = " Language";
    document.write("<b>concat():</b> " + str.concat(str2) + "<br><br>");

    // indexOf()
    document.write("<b>indexOf():</b> " + str.indexOf("JavaScript") + "<br><br>");

    // lastIndexOf()
    var str3 = "JavaScript is easy. JavaScript is useful.";
    document.write("<b>lastIndexOf():</b> " + str3.lastIndexOf("JavaScript") + "<br><br>");

    // search()
    document.write("<b>search():</b> " + str.search("JavaScript") + "<br><br>");

    // match()
    document.write("<b>match():</b> " + str.match("JavaScript") + "<br><br>");

    // replace()
    document.write("<b>replace():</b> " + str.replace("JavaScript", "HTML") + "<br><br>");

    // substr()
    document.write("<b>substr():</b> " + str.substr(11, 10) + "<br><br>");

    // substring()
    document.write("<b>substring():</b> " + str.substring(11, 21) + "<br><br>");

</script>

</body>
</html>
