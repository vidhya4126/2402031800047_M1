<!DOCTYPE html>
<html>
<body>
  <h3>Even Numbers:</h3>
  <div id="even-list"></div>

  <script>
    let output = "";
    for (let i = 1; i <= 20; i++) {
      if (i % 2 == 0) {
        output += i + " ";
      }
    }
    document.getElementById("even-list").innerHTML = output;
  </script>
</body>
</html>
