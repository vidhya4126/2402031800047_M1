
<html>
    <head>
        <title>Increment</title>
    </head>
<body>
    <h2>JavaScript Increment Example</h2>

    <script>
        var a=5;
        document.write(a);
        var b=a++;
        document.write("<br>");
        document.write(b)

        var c=5;
        document.write("<br>")
        document.write("<br>")
        document.write(c);
        var d=++c;
        document.write("<br>");
        document.write(d)
    </script>
</body>
</html>
