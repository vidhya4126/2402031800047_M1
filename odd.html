<!DOCTYPE html>
<html>
<body>
  <h3>Odd Numbers:</h3>
  <div id="odd-list"></div>

  <script>
    let output = "";
    for (let i = 1; i <= 20; i++) {
      if (i % 2 !== 0) {
        output += i + " ";
      }
    }
    document.getElementById("odd-list").innerHTML = output;
  </script>
</body>
</html>
