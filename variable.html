<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum Function</title>
</head>
<body>

<script>

    function sum() {
        var s = 0;

        for (var i = 0; i < arguments.length; i++) {
            s += Number(arguments[i]);
        }

        return s;
    }

    var a = sum(1, 2, 3);
    document.write("Sum 1 = " + a + "<br>");

    var b = sum(1, 2, 3, 4, 5);
    document.write("Sum 2 = " + b + "<br>");

    var c = sum(1, 2, "3", 4, 5);
    document.write("Sum 3 = " + c);

</script>

</body>
</html>
