<html>
    <head>
        <title>Data Types</title>
    </head>

<body>
    <h2>Different Data Types</h2>
</body>

<script>
    var a =4
    document.write(typeof(a));
    document.write("<br>"+a);

    var b =[1,2,3]
    document.write("<br>");
    document.write(typeof(b));
    document.write("<br>"+b);

    
    var c =true
    document.write("<br>");
    document.write(typeof(c));
    document.write("<br>"+c);
</script>
</html>
