<!DOCTYPE html>
<html>
<body>
    <script>
        let str = "Hello World";
        let reversed = "";

        // Loop starts from the last character and moves backwards
        for (let i = str.length - 1; i >= 0; i--) {
            reversed += str[i];
        }

        document.write("Original: " + str + "<br>");
        document.write("Reversed: " + reversed);
    </script>
</body>
</html>
