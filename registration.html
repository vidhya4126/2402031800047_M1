<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        background-color: lightgreen;
    }
</style>
<body>
    <form>
        <h1 align="center">Registration form</h1>
        <table align="center" border="1" width="600">
            <tr>
                <td>First Name</td>
                <td>
                    <input type="text" placeholder="Enter First Name" required>
                </td>
            </tr>

            <tr>
                <td>Last Name</td>
                <td>
                    <input type="text" placeholder="Enter Last Name" required>
                </td>
            </tr>

            <tr>
                <td>Contact no.</td>
                <td>
                    <input type="tel" placeholder="Enter Mobile Number" pattern="[0-9]{10}" required>
                </td>
            </tr>

            <tr>
                <td>Email Id</td>
                <td>
                    <input type="email" placeholder="Enter your EmailId" required>
                </td>
            </tr>

            <tr>
                <td>Password</td>
                <td>
                    <input type="password" placeholder="Enter Password" required>
                </td>
            </tr>

            <tr>
                <td>Date Of Birth</td>
                <td>
                    <input type="date">
                </td>
            </tr>

            <tr>
                <td>Age</td>
                <td>
                    <input type="number" min="18" max="60">
                </td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender">Male
                    <input type="radio" name="gender">Female                   
                </td>
            </tr>

            <tr>
                <td>Address</td>
                <td>
                    <textarea rows="4" cols="20"></textarea>
                </td>
            </tr>

            <tr>
                <td>City</td>
                <td>
                    <select>
                        <option>select city</option>
                        <option>Ahmedabad</option>
                        <option>Rajkot</option>
                        <option>Surat</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Pincode</td>
                <td>
                    <input type="number" pattern="[0-9]{6}" required>
                </td>
            </tr>

            <tr>
                <td>Joining Date</td>
                <td>
                    <input type="date">
                </td>
            </tr>

            <tr>
                <td>College User Form</td>
                <td>
                    <input type="submit" value="submit">
                    <input type="reset" value="reset">
                </td>
            </tr>  

        </table>
    </form>
</body>
</html>
